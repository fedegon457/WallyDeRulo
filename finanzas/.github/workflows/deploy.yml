name: Deploy to Hetzner

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finanzas/package-lock.json

      - name: Install dependencies
        working-directory: finanzas
        run: npm ci

      - name: Build
        id: build
        working-directory: finanzas
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "❌ Supabase secrets missing"
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env
          echo "NODE: $(node --version) NPM: $(npm --version)"
          npm run build 2>&1 | tee /tmp/build_output.txt; BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            CONTENT=$(python3 -c "import json,sys; print(json.dumps(open('/tmp/build_output.txt').read()[-8000:]))")
            curl -s -X POST https://api.github.com/gists \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"public\":true,\"description\":\"MyWalli CI build error\",\"files\":{\"build-error.txt\":{\"content\":$CONTENT}}}" \
              | python3 -c "import sys,json; g=json.load(sys.stdin); print('GIST:', g.get('html_url','error: '+str(g)))"
          fi
          exit $BUILD_EXIT

      - name: Deploy to server
        working-directory: finanzas
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.224.48.242 >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 root@46.224.48.242 "rm -rf /var/www/wallyderulo/assets"
          scp -i ~/.ssh/id_ed25519 -r dist/* root@46.224.48.242:/var/www/wallyderulo/
          ssh -i ~/.ssh/id_ed25519 root@46.224.48.242 "chmod -R 755 /var/www/wallyderulo/ && systemctl reload nginx"

          echo "Deploy completo -> https://mywalli.com.ar"
